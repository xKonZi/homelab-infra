---
# System identity and localization
server_hostname: g580
admin_user: konzi
server_timezone: Europe/Warsaw

# Storage layout on 250 GB SSD (installer sets root '/' LV to 60G)
lvm_vg_name: ubuntu-vg
lvm_volumes:
  - name: lv_docker
    size: 50G
    fstype: ext4
    mount_point: /var/lib/docker
    opts: defaults,noatime
  - name: lv_srv
    size: 60G
    fstype: ext4
    mount_point: /srv
    opts: defaults,noatime

# Laptop-as-server tuning (8 GB RAM, closed lid, Wi-Fi stability)
zram_size_expression: "min(ram / 2, 4096)"
zram_compression_algorithm: zstd
console_blank_seconds: 60
disable_wifi_power_save: true

# Network and Zero Trust SSH/UFW policy
ssh_port: 22
tailscale_interface: tailscale0
ssh_allow_tcp_forwarding: "local"

# Docker CE engine settings
docker_apt_arch: amd64
docker_log_max_size: "10m"
docker_log_max_file: "3"
docker_live_restore: true

# Off-site encrypted backups (Restic + rclone -> Google Drive)
backup_enabled: true
backup_rclone_remote_name: gdrive
backup_rclone_remote_path: homelab-backups/g580/restic
# Keep false on day-2 runs so Ansible does not overwrite rclone's rotated OAuth access tokens.
# Override with -e backup_rclone_force_update=true when intentionally rotating credentials.
backup_rclone_force_update: false
backup_paths:
  - /srv
  - /etc
  - "/home/{{ admin_user }}"
backup_exclude_patterns:
  - "*.tmp"
  - "*.log"
  - "/srv/**/cache/**"
  - "/home/{{ admin_user }}/.antigravity-hub-server"
  - "/home/{{ admin_user }}/.cache"
  - "/home/{{ admin_user }}/.npm"
  - "/home/{{ admin_user }}/.local/share/Trash"
  - "/home/{{ admin_user }}/.gemini/antigravity/daemon"
  - "/home/{{ admin_user }}/.gemini/antigravity/browser_sandbox"
  - "**/.venv"
  - "**/node_modules"
  - "**/__pycache__"
  - "**/target/debug"
  - "**/target/release"
backup_schedule: "*-*-* 03:30:00"
backup_retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 3
# Agent host & central workspace (Stage W1)
agent_host_enabled: true
agent_host_packages:
  - gh
  - jq
  - nodejs
  - pipx
  - python3-venv
  - ripgrep
agent_host_workspace_dirs:
  - projects
  - ops
  - life
agent_host_hub_service_enabled: true
agent_host_hub_memory_high: "2G"
agent_host_hub_memory_max: "3G"

# Battery UPS & power management (Lenovo G580)
power_enabled: true
power_battery_name: BAT1
power_ac_adapter_name: ACAD
power_conservation_mode_enabled: true
power_conservation_mode_path: /sys/bus/platform/drivers/ideapad_acpi/VPC2004:00/conservation_mode
power_ups_shutdown_threshold_percent: 20
power_ups_check_interval_seconds: 60
# G580 ACPI reports ENERGY_* in 10 uWh units (4884000 = 48.84 Wh) instead of standard 1 uWh.
power_energy_scale_divisor: 100000
