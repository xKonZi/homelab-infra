---
- name: Validate sshd syntax before reload
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  listen: Validate and reload ssh

- name: Reload ssh service
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Validate and reload ssh
